<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href='css/project.css'>
    <link rel="stylesheet" href="css/all.min.css">
    <title>DevCraft Editor</title>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="item margin">
                <div>
                    <button class="html-btn">
                        <i class="fa-brands fa-html5 fa-xl" style="color: #e34c26;"></i> html
                    </button>
                    <button class="css-btn">
                        <i class="fa-brands fa-css3-alt fa-xl" style="color: #264de4;"></i> css
                    </button>
                    <button class="js-btn">
                        <i class="fa-brands fa-js fa-xl" style="color: #f0db4f;"></i> js
                    </button>
                </div>
                <textarea id="html" placeholder="HTML Code..."></textarea>
                <textarea id="css" placeholder="Css Code..."></textarea>
                <textarea id="js" placeholder="JavaScript Code..."></textarea>
            </div>
            <div class="item">
                <iframe id="output" frameborder="1"></iframe>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="js/script2.js"></script>
</body>
</html>
